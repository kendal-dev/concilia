services:
  db:
    image: mariadb:11
    container_name: concilia-db
    environment:
      MARIADB_ROOT_PASSWORD: concilia
      MARIADB_DATABASE: concilia
      MARIADB_USER: concilia
      MARIADB_PASSWORD: concilia
    ports:
      - "3307:3306"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/00-schema.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/01-seed.sql
    command: --innodb-buffer-pool-size=128M
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 12
